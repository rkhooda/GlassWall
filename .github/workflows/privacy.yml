name: Privacy Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy:
    name: Privacy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @glasswall/privacy typecheck

      - name: Privacy unit tests
        run: pnpm --filter @glasswall/privacy test

      - name: Build extension
        run: pnpm --filter @glasswall/extension build

      - name: Verify boundary
        run: ./scripts/verify-boundary.sh

      - name: Leakage smoke test
        if: false
        run: |
          echo "Skipping leakage smoke in CI — requires built bench site"
          echo "Run locally: pnpm --filter @glasswall/bench-site dev && pnpm --filter @glasswall/privacy test:leakage"